<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Results console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="engine.css">
</head>
<body>
<div class="wrap" id="app"><p class="muted">Loading...</p></div>
<script src="config.js"></script>
<script src="catalog.js"></script>
<script>
(function(){
  window.SF_MANUAL = true; window.SF_TEACHER = true;
  var app = document.getElementById('app');
  function add(src, done){ var s = document.createElement('script'); s.src = src; s.onload = done; s.onerror = done; document.body.appendChild(s); }
  add('engine.js', function(){
    var list = (window.CATALOG || []).map(function(e){ return 'games/' + e.file; }), left = list.length;
    function go(){ SF.start(); }
    if (!left) { go(); return; }
    list.forEach(function(f){ add(f, function(){ left--; if (!left) go(); }); });
  });
})();
</script>
</body>
</html>
